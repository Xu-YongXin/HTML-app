<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>HTML 预览器</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121a24;
    --panel-2: #0f1620;
    --line: #1f2b39;
    --text: #e6edf3;
    --muted: #8798ab;
    --accent: #34d399;
    --accent-dim: #1d6b52;
    --blue: #5b8def;
    --danger: #ff6b6b;
    --radius: 14px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC",
                 "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- header ---------- */
  header {
    padding: calc(var(--sat) + 10px) 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .logo {
    width: 28px; height: 28px; border-radius: 9px; flex: none;
    background: linear-gradient(140deg, var(--accent), var(--blue));
    display: grid; place-items: center;
    color: #04120c; font-weight: 800; font-size: 15px; letter-spacing: -1px;
  }
  h1 { font-size: 16px; font-weight: 650; margin: 0; white-space: nowrap; }
  .ver { font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* ---------- tabs ---------- */
  .tabs {
    margin: 4px 16px 10px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
  }
  .tab {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; font-weight: 550;
    padding: 9px 0; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .16s ease, color .16s ease;
  }
  .tab.active { background: #1b2734; color: var(--text); }
  .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: none; }
  .tab.active .dot { display: block; }

  /* ---------- main ---------- */
  main { flex: 1; min-height: 0; position: relative; display: flex; }
  section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  section[hidden] { display: none; }

  /* ---------- editor ---------- */
  .editor-wrap {
    flex: 1; min-height: 0; margin: 0 16px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #src {
    flex: 1; min-height: 0; width: 100%;
    background: transparent; color: #cfe3ff; border: 0; outline: 0; resize: none;
    padding: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.62; tab-size: 2;
    -webkit-user-select: text; user-select: text;
  }
  #src::placeholder { color: #55677a; }

  .meta-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted); flex-wrap: wrap;
  }
  .chip {
    padding: 3px 8px; border-radius: 999px; font-size: 11px;
    background: #17212c; border: 1px solid #233242; color: #9fb1c4;
  }
  .chip.kind-full { color: #7ee2b8; border-color: #1f5c47; background: #10241d; }
  .chip.kind-fragment { color: #9dc0ff; border-color: #24457c; background: #101a2b; }
  .chip.kind-text { color: #ffd08a; border-color: #6b4d1d; background: #241b0e; }

  .tools { display: flex; gap: 8px; padding: 10px 16px 0; }
  .tool {
    flex: 1; appearance: none; font: inherit; font-size: 12.5px;
    color: #b8c8d9; background: var(--panel); border: 1px solid var(--line);
    padding: 9px 4px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .tool:active { background: #1a2634; }
  .tool svg { width: 14px; height: 14px; opacity: .85; }

  /* ---------- preview ---------- */
  .preview-wrap {
    flex: 1; min-height: 0; margin: 0 16px;
    background: #fff; border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--line); position: relative;
  }
  #pv { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .preview-empty {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    color: #7b8b9d; font-size: 13px; padding: 24px; background: var(--panel-2); line-height: 1.8;
  }
  .preview-empty[hidden] { display: none; }
  .float-btn {
    position: absolute; right: 10px; bottom: 10px;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(14, 22, 32, .82); color: #cfe3ff; border: 1px solid #2a3a4c;
    display: grid; place-items: center; backdrop-filter: blur(6px);
  }
  .float-btn svg { width: 17px; height: 17px; }

  /* ---------- footer actions ---------- */
  footer {
    padding: 10px 16px calc(var(--sab) + 12px);
    display: flex; gap: 8px; align-items: stretch;
  }
  .btn {
    appearance: none; font: inherit; border-radius: 13px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 14px; font-weight: 600;
    padding: 13px 12px; display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: transform .08s ease, background .16s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary {
    flex: 1; background: linear-gradient(135deg, #34d399, #22b07d);
    color: #04150e; border-color: transparent;
  }
  .btn.icon { width: 52px; padding: 13px 0; color: #b9c9d9; }
  .btn svg { width: 18px; height: 18px; }
  .btn[disabled] { opacity: .45; }

  /* ---------- sheet ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .55);
    opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 40;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: #101821; border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    transform: translateY(102%); transition: transform .24s cubic-bezier(.22,.8,.28,1);
    max-height: 76vh; display: flex; flex-direction: column;
    padding-bottom: calc(var(--sab) + 10px);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px; border-bottom: 1px solid var(--line);
  }
  .sheet-head h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .link-btn { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; padding: 4px; }
  .link-btn.danger { color: var(--danger); }
  .sheet-body { overflow: auto; padding: 6px 12px 12px; -webkit-overflow-scrolling: touch; }
  .hist-item {
    padding: 11px 12px; border-radius: 11px; border: 1px solid transparent;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .hist-item:active { background: #16202b; }
  .hist-item + .hist-item { border-top: 1px solid #182330; border-radius: 0; }
  .hist-main { flex: 1; min-width: 0; }
  .hist-title {
    font-size: 13.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hist-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .empty-hint { text-align: center; color: var(--muted); font-size: 12.5px; padding: 30px 0; line-height: 1.8; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--sab) + 92px);
    transform: translate(-50%, 12px);
    background: rgba(24, 33, 45, .96); border: 1px solid #2a3a4c;
    color: #dbe7f3; padding: 9px 16px; border-radius: 999px; font-size: 12.5px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60;
    max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  .spin { animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">&lt;/&gt;</div>
    <h1>HTML 预览器</h1>
  </div>
  <div class="ver" id="ver">v1.0</div>
</header>

<div class="tabs" role="tablist">
  <button class="tab active" id="tabEdit" role="tab"><span class="dot"></span>输入代码</button>
  <button class="tab" id="tabView" role="tab"><span class="dot"></span>预览效果</button>
</div>

<main>
  <section id="paneEdit">
    <div class="tools">
      <button class="tool" id="btnPaste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="3" width="8" height="4" rx="1.5"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>
        粘贴
      </button>
      <button class="tool" id="btnFile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3v5h5"/><path d="M19 8v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7z"/></svg>
        文件
      </button>
      <button class="tool" id="btnDemo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.4 5.6L20 10l-4.4 3.6L16.8 20 12 16.8 7.2 20l1.2-6.4L4 10l5.6-1.4z"/></svg>
        示例
      </button>
      <button class="tool" id="btnClear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
        清空
      </button>
    </div>
    <div class="editor-wrap" style="margin-top:10px;">
      <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="把 DeepSeek 生成的 HTML 代码整段粘贴进来，会自动清洗并转成可预览的页面…"></textarea>
      <div class="meta-bar">
        <span class="chip" id="chipKind">等待输入</span>
        <span id="chipSize">0 字符</span>
        <span id="chipNote" style="flex:1;text-align:right;"></span>
      </div>
    </div>
  </section>

  <section id="paneView" hidden>
    <div class="preview-wrap">
      <iframe id="pv" title="预览" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads allow-pointer-lock"></iframe>
      <div class="preview-empty" id="pvEmpty">还没有内容<br>回到「输入代码」粘贴一段 HTML 吧</div>
      <button class="float-btn" id="btnRefresh" title="重新加载预览">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></svg>
      </button>
    </div>
  </section>
</main>

<footer>
  <button class="btn primary" id="btnOpen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M19 14v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    浏览器打开
  </button>
  <button class="btn icon" id="btnSave" title="保存为 .html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
  </button>
  <button class="btn icon" id="btnShare" title="分享">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.4 10.8l7.2-4.2M8.4 13.2l7.2 4.2"/></svg>
  </button>
  <button class="btn icon" id="btnHist" title="历史记录">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
  </button>
</footer>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <h2>历史记录</h2>
    <div>
      <button class="link-btn danger" id="btnClearHist">清空</button>
      <button class="link-btn" id="btnCloseSheet">关闭</button>
    </div>
  </div>
  <div class="sheet-body" id="histBody"></div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept=".html,.htm,.txt,text/html,text/plain" style="display:none">

<script>
(function () {
  'use strict';

  var HIST_KEY = 'hvp.history.v1';
  var HIST_LIMIT = 30;
  var MAX_INPUT = 3 * 1024 * 1024;

  var $ = function (id) { return document.getElementById(id); };

  var el = {
    src: $('src'), pv: $('pv'), pvEmpty: $('pvEmpty'),
    chipKind: $('chipKind'), chipSize: $('chipSize'), chipNote: $('chipNote'),
    tabEdit: $('tabEdit'), tabView: $('tabView'),
    paneEdit: $('paneEdit'), paneView: $('paneView'),
    toast: $('toast'), sheet: $('sheet'), backdrop: $('backdrop'),
    histBody: $('histBody'), fileInput: $('fileInput'), ver: $('ver'),
    btnOpen: $('btnOpen'), btnSave: $('btnSave'), btnShare: $('btnShare')
  };

  var state = { raw: '', doc: '', kind: 'empty', notes: [], title: '未命名页面' };

  /* ------------------------------------------------------------------ */
  /* 原生能力探测                                                        */
  /* ------------------------------------------------------------------ */
  function hasNative (fn) {
    return !!(window.Android && typeof window.Android[fn] === 'function');
  }

  var toastTimer = null;
  function toast (msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 2200);
  }

  /* ------------------------------------------------------------------ */
  /* 代码清洗：去掉 ``` 围栏、解释性前后缀，判断是整页 / 片段 / 纯文本      */
  /* ------------------------------------------------------------------ */
  var FENCE_RE = /```[ \t]*([a-zA-Z0-9_+#-]*)[ \t]*\r?\n([\s\S]*?)```/g;

  function pickFencedBlock (raw) {
    var blocks = [];
    var m;
    FENCE_RE.lastIndex = 0;
    while ((m = FENCE_RE.exec(raw)) !== null) {
      blocks.push({ lang: (m[1] || '').toLowerCase(), code: m[2] });
    }
    if (!blocks.length) return null;

    function score (b) {
      var s = 0;
      if (b.lang === 'html' || b.lang === 'htm' || b.lang === 'xhtml') s += 100;
      if (/<html[\s>]/i.test(b.code)) s += 60;
      if (/<!doctype\s+html/i.test(b.code)) s += 60;
      if (/<(div|body|section|main|p|span|h[1-6]|ul|ol|table|img|canvas|svg|button|style|script|form)\b/i.test(b.code)) s += 30;
      s += Math.min(b.code.length / 4000, 15);
      return s;
    }
    blocks.sort(function (a, b) { return score(b) - score(a); });
    return blocks[0];
  }

  function looksLikeMarkup (text) {
    var open = (text.match(/<[a-zA-Z][\w:-]*(\s[^<>]*)?>/g) || []).length;
    var close = (text.match(/<\/[a-zA-Z][\w:-]*\s*>/g) || []).length;
    return open >= 2 || (open >= 1 && close >= 1) || /<!doctype\s+html/i.test(text);
  }

  function escapeHtml (s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function stripTags (s) {
    return String(s).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function wrapFragment (body) {
    return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>预览</title>\n</head>\n<body>\n' + body + '\n</body>\n</html>';
  }

  function wrapPlainText (text) {
    return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>纯文本</title>\n<style>body{margin:0;padding:16px;font:15px/1.7 -apple-system,' +
      '"PingFang SC",system-ui,sans-serif;color:#1f2328;background:#fff;white-space:pre-wrap;' +
      'word-break:break-word}</style>\n</head>\n<body>' + escapeHtml(text) + '</body>\n</html>';
  }

  function patchDocument (html, notes) {
    var doc = html;
    var hasHtml = /<html[\s>]/i.test(doc);
    if (!hasHtml) {
      doc = wrapFragment(doc);
      notes.push('已补全页面骨架');
    }
    if (!/<!doctype\s+html/i.test(doc)) {
      doc = '<!DOCTYPE html>\n' + doc;
    }
    if (!/<meta[^>]+charset/i.test(doc)) {
      if (/<head[^>]*>/i.test(doc)) {
        doc = doc.replace(/<head([^>]*)>/i, '<head$1><meta charset="utf-8">');
      } else if (/<html([^>]*)>/i.test(doc)) {
        doc = doc.replace(/<html([^>]*)>/i, '<html$1><head><meta charset="utf-8"></head>');
      }
      notes.push('补了 utf-8 编码');
    }
    if (!/<meta[^>]+name=["']viewport["']/i.test(doc)) {
      var vp = '<meta name="viewport" content="width=device-width, initial-scale=1">';
      if (/<head[^>]*>/i.test(doc)) {
        doc = doc.replace(/<head([^>]*)>/i, '<head$1>' + vp);
      } else if (/<html([^>]*)>/i.test(doc)) {
        doc = doc.replace(/<html([^>]*)>/i, '<html$1><head>' + vp + '</head>');
      } else {
        doc = doc.replace(/<body/i, '<head>' + vp + '</head><body');
      }
      notes.push('补了手机 viewport');
    }
    return doc;
  }

  function convert (raw) {
    var notes = [];
    var text = String(raw || '').replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').trim();
    if (!text) return { doc: '', kind: 'empty', notes: notes, title: '未命名页面' };

    var fenced = pickFencedBlock(text);
    if (fenced) {
      text = fenced.code.trim();
      notes.push('已移除 ``` 代码块标记');
    }

    var kind;
    var doc;
    if (/<html[\s>]/i.test(text) || /<!doctype\s+html/i.test(text)) {
      kind = 'full';
      doc = patchDocument(text, notes);
    } else if (looksLikeMarkup(text)) {
      kind = 'fragment';
      doc = patchDocument(text, notes);
    } else {
      kind = 'text';
      doc = wrapPlainText(text);
      notes.push('按纯文本渲染');
    }

    return { doc: doc, kind: kind, notes: notes, title: guessTitle(doc) };
  }

  function guessTitle (doc) {
    var m = doc.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    if (m) {
      var t = stripTags(m[1]).slice(0, 60);
      if (t && t !== '预览' && t !== '纯文本') return t;
    }
    m = doc.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
    if (m) {
      var h = stripTags(m[1]).slice(0, 60);
      if (h) return h;
    }
    return '未命名页面';
  }

  /* ------------------------------------------------------------------ */
  /* 渲染                                                                */
  /* ------------------------------------------------------------------ */
  var KIND_TEXT = { full: '完整页面', fragment: 'HTML 片段', text: '纯文本', empty: '等待输入' };
  var KIND_CLASS = { full: 'kind-full', fragment: 'kind-fragment', text: 'kind-text' };

  function syncMeta () {
    el.chipKind.textContent = KIND_TEXT[state.kind] || '等待输入';
    el.chipKind.className = 'chip' + (KIND_CLASS[state.kind] ? ' ' + KIND_CLASS[state.kind] : '');
    var size = state.raw.length;
    el.chipSize.textContent = size >= 1024
      ? (size / 1024).toFixed(size >= 102400 ? 0 : 1) + ' KB'
      : size + ' 字符';
    el.chipNote.textContent = state.notes.join(' · ');
    [el.btnOpen, el.btnSave, el.btnShare].forEach(function (b) {
      if (b) b.disabled = !state.doc;
    });
  }

  function renderPreview () {
    if (!state.doc) {
      el.pv.srcdoc = '<!DOCTYPE html><html><body></body></html>';
      el.pvEmpty.hidden = false;
      return;
    }
    el.pvEmpty.hidden = true;
    el.pv.srcdoc = state.doc;
  }

  var convertTimer = null;
  function scheduleConvert (immediate) {
    clearTimeout(convertTimer);
    convertTimer = setTimeout(applyConvert, immediate ? 0 : 420);
  }

  function applyConvert () {
    var result = convert(state.raw);
    state.doc = result.doc;
    state.kind = result.kind;
    state.notes = result.notes;
    state.title = result.title;
    syncMeta();
    if (!$('paneView').hidden) renderPreview();
  }

  function setRaw (text, opts) {
    opts = opts || {};
    if (text && text.length > MAX_INPUT) {
      text = text.slice(0, MAX_INPUT);
      toast('内容过大，已截断到 3MB');
    }
    state.raw = text || '';
    el.src.value = state.raw;
    applyConvert();
    if (opts.switchToView) switchTab('view');
    else if (opts.switchToEdit) switchTab('edit');
  }

  function switchTab (which) {
    var isView = which === 'view';
    el.paneEdit.hidden = isView;
    el.paneView.hidden = !isView;
    el.tabEdit.classList.toggle('active', !isView);
    el.tabView.classList.toggle('active', isView);
    if (isView) {
      renderPreview();
    }
  }

  /* ------------------------------------------------------------------ */
  /* 设备上的原生动作                                                    */
  /* ------------------------------------------------------------------ */
  function doOpen () {
    if (!state.doc) { toast('先粘贴一段 HTML'); return; }
    addHistory();
    if (hasNative('openInBrowser')) {
      try {
        window.Android.openInBrowser(state.title, state.doc);
        toast('正在用浏览器打开…');
        return;
      } catch (e) { /* fallthrough */ }
    }
    openInNewTab(state.doc);
  }

  function openInNewTab (html) {
    try {
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var w = window.open(url, '_blank');
      if (!w) toast('浏览器拦截了新窗口，请手动复制');
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    } catch (e) {
      toast('打开失败：' + e.message);
    }
  }

  function downloadHtml (html, name) {
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 4000);
  }

  function fileSafe (s) {
    return (s || 'page').replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 40);
  }

  function doSave () {
    if (!state.doc) { toast('先粘贴一段 HTML'); return; }
    addHistory();
    if (hasNative('saveHtml')) {
      var ok = window.Android.saveHtml(state.title, state.doc);
      if (ok === false) toast('保存失败');
      return;
    }
    downloadHtml(state.doc, fileSafe(state.title) + '.html');
    toast('已开始下载');
  }

  function doShare () {
    if (!state.doc) { toast('先粘贴一段 HTML'); return; }
    addHistory();
    if (hasNative('shareHtml')) {
      window.Android.shareHtml(state.title, state.doc);
      return;
    }
    if (navigator.share) {
      navigator.share({ title: state.title, text: state.title }).catch(function () {});
      return;
    }
    downloadHtml(state.doc, fileSafe(state.title) + '.html');
  }

  function doPaste () {
    if (hasNative('readClipboard')) {
      var text = window.Android.readClipboard();
      if (text && text.trim()) {
        setRaw(text, { switchToView: false });
        toast('已从剪贴板粘贴 ' + text.length + ' 个字符');
        return;
      }
    }
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (t) {
        if (t && t.trim()) setRaw(t);
        else toast('剪贴板里没有文本');
      }).catch(function () {
        el.src.focus();
        toast('请长按输入框手动粘贴');
      });
      return;
    }
    el.src.focus();
    toast('请长按输入框手动粘贴');
  }

  /* ------------------------------------------------------------------ */
  /* 历史记录                                                            */
  /* ------------------------------------------------------------------ */
  function loadHistory () {
    try {
      var arr = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function saveHistory (arr) {
    try { localStorage.setItem(HIST_KEY, JSON.stringify(arr.slice(0, HIST_LIMIT))); }
    catch (e) { /* 存储满或被禁用，忽略 */ }
  }

  function addHistory () {
    if (!state.raw || state.raw.length < 30) return;
    var arr = loadHistory();
    if (arr.length && arr[0].code === state.raw) return;
    arr = arr.filter(function (it) { return it.code !== state.raw; });
    arr.unshift({
      id: String(Date.now()),
      title: state.title,
      kind: state.kind,
      code: state.raw,
      ts: Date.now()
    });
    saveHistory(arr);
  }

  function fmtTime (ts) {
    var d = new Date(ts);
    var p = function (n) { return n < 10 ? '0' + n : String(n); };
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function renderHistory () {
    var arr = loadHistory();
    if (!arr.length) {
      el.histBody.innerHTML = '<div class="empty-hint">还没有记录<br>打开 / 保存 / 分享过的页面会自动出现在这里</div>';
      return;
    }
    var frag = document.createDocumentFragment();
    arr.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'hist-item';
      var size = item.code.length >= 1024
        ? (item.code.length / 1024).toFixed(1) + ' KB'
        : item.code.length + ' 字符';
      row.innerHTML = '<div class="hist-main">' +
        '<div class="hist-title"></div>' +
        '<div class="hist-sub">' + fmtTime(item.ts) + ' · ' + size + ' · ' +
        (KIND_TEXT[item.kind] || '页面') + '</div></div>';
      row.querySelector('.hist-title').textContent = item.title || '未命名页面';
      row.addEventListener('click', function () {
        closeSheet();
        setRaw(item.code, { switchToView: true });
        toast('已载入：' + (item.title || '未命名页面'));
      });
      frag.appendChild(row);
    });
    el.histBody.innerHTML = '';
    el.histBody.appendChild(frag);
  }

  function openSheet () {
    renderHistory();
    el.sheet.classList.add('show');
    el.backdrop.classList.add('show');
  }
  function closeSheet () {
    el.sheet.classList.remove('show');
    el.backdrop.classList.remove('show');
  }

  /* ------------------------------------------------------------------ */
  /* 事件绑定                                                            */
  /* ------------------------------------------------------------------ */
  el.src.addEventListener('input', function () {
    state.raw = el.src.value;
    scheduleConvert(false);
  });

  el.src.addEventListener('paste', function () {
    // 让默认粘贴先发生，再统一转换
    setTimeout(function () {
      state.raw = el.src.value;
      scheduleConvert(true);
    }, 0);
  });

  el.tabEdit.addEventListener('click', function () { switchTab('edit'); });
  el.tabView.addEventListener('click', function () { switchTab('view'); });

  $('btnPaste').addEventListener('click', doPaste);
  $('btnFile').addEventListener('click', function () { el.fileInput.click(); });
  $('btnClear').addEventListener('click', function () {
    if (!state.raw) return;
    setRaw('');
    el.src.value = '';
    toast('已清空');
  });
  $('btnDemo').addEventListener('click', function () {
    setRaw(DEMO, { switchToView: true });
  });

  $('btnRefresh').addEventListener('click', function () {
    renderPreview();
    toast('已重新加载预览');
  });

  el.fileInput.addEventListener('change', function () {
    var f = el.fileInput.files && el.fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      setRaw(String(reader.result || ''), { switchToView: false });
      toast('已读取 ' + f.name);
    };
    reader.readAsText(f, 'utf-8');
    el.fileInput.value = '';
  });

  $('btnOpen').addEventListener('click', doOpen);
  $('btnSave').addEventListener('click', doSave);
  $('btnShare').addEventListener('click', doShare);
  $('btnHist').addEventListener('click', openSheet);
  $('btnCloseSheet').addEventListener('click', closeSheet);
  el.backdrop.addEventListener('click', closeSheet);
  $('btnClearHist').addEventListener('click', function () {
    saveHistory([]);
    renderHistory();
    toast('历史已清空');
  });

  /* 从其它 App「分享」过来的文本 */
  window.__RECEIVE_SHARED__ = function (text) {
    if (!text) return;
    setRaw(text, { switchToView: true });
    toast('已接收分享内容');
  };

  /* ------------------------------------------------------------------ */
  /* 启动                                                                */
  /* ------------------------------------------------------------------ */
  (function init () {
    if (hasNative('appVersion')) {
      try { el.ver.textContent = 'v' + window.Android.appVersion(); } catch (e) {}
    }
    syncMeta();
    renderPreview();
    // 首次启动引导：给一段示例占位，方便直接点预览看效果
    if (!state.raw) {
      el.chipNote.textContent = '支持直接粘贴 ```html 代码块';
    }
  })();

  var DEMO = [
    '<!DOCTYPE html>',
    '<html lang="zh-CN"><head><meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1">',
    '<title>示例：呼吸卡片</title>',
    '<style>',
    '  :root{color-scheme:light}',
    '  body{margin:0;min-height:100vh;display:grid;place-items:center;',
    '       font-family:-apple-system,"PingFang SC",system-ui,sans-serif;',
    '       background:radial-gradient(circle at 30% 20%,#e8f7ff,#ffffff 60%);}',
    '  .card{width:min(86vw,360px);padding:28px 24px;border-radius:24px;',
    '        background:#fff;box-shadow:0 18px 50px rgba(20,60,90,.14);text-align:center;',
    '        animation:float 4s ease-in-out infinite;}',
    '  h1{margin:0 0 8px;font-size:20px;color:#12324a}',
    '  p{margin:0;color:#5b7488;font-size:14px;line-height:1.7}',
    '  .dot{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;',
    '       background:conic-gradient(from 0deg,#34d399,#5b8def,#34d399);',
    '       animation:pulse 2.4s ease-in-out infinite;}',
    '  @keyframes float{50%{transform:translateY(-8px)}}',
    '  @keyframes pulse{50%{transform:scale(.86);opacity:.75}}',
    '</style></head>',
    '<body><div class="card"><div class="dot"></div>',
    '<h1>手机端渲染成功</h1>',
    '<p>这段示例在 App 内预览和系统浏览器里<br>应该完全一致。</p></div></body></html>'
  ].join('\n');
})();
</script>
</body>
</html>
